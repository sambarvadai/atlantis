# MCP-Agent Configuration File
# Config definition: https://github.com/lastmile-ai/mcp-agent/blob/main/src/mcp_agent/config.py
$schema: https://raw.githubusercontent.com/lastmile-ai/mcp-agent/refs/heads/main/schema/mcp-agent.config.schema.json

name: remote_tech_support_agent

# Execution engine: asyncio or temporal
# For temporal mode, see: https://github.com/lastmile-ai/mcp-agent/blob/main/examples/temporal/README.md
execution_engine: asyncio

logger:
  transports: [console, file]
  level: info
  path: logs/mcp-agent.log

# Configure MCP Servers connections (supports stdio, sse, streamable_http, and websockets)
mcp:
  servers:
    # System operations server
    system_ops:
      transport: streamable_http
      url: "http://localhost:8001/mcp"
      http_timeout_seconds: 30
      read_timeout_seconds: 120

    # Filesystem access server
    filesystem:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-filesystem", "."]

    # Web fetch server
    fetch:
      command: uvx
      args: ["mcp-server-fetch"]

    # Tavily remote MCP search server
    # NOTE: Replace <your-api-key> with your real Tavily API key
    # in your local, uncommitted copy of this file.
    tavily:
        transport: stdio
        command: npx
        args: ["-y", "mcp-remote","https://mcp.tavily.com/mcp/?tavilyApiKey=your_api_key"]

# Agent definitions
agents:
  definitions:
    - name: system_helper
      instruction: |
        You are a system administration assistant. You can help with:
        - Viewing system information (CPU, memory, disk usage)
        - Managing processes
        - Checking network status
        - Running system diagnostics
      server_names: [system_ops]

    - name: filesystem_helper
      instruction: "You can read files and summarize their contents."
      server_names: [filesystem]

    - name: web_helper
      instruction: "You can fetch web pages and summarize their content."
      server_names: [fetch]

    - name: tavily_helper
      instruction: |
        You are a troubleshooting assistant that only uses the `tavily` MCP server
        to search the web for compatibility information, error codes, known issues,
        and OS-specific step-by-step instructions. Do not invent facts; base your
        answers on Tavily search results and cite what you found in plain language.
      server_names: [tavily]

    - name: windows_troubleshooter
      instruction: |
        You are a Windows troubleshooting assistant.
        - Use the `system_ops` server to inspect and fix local issues on this Windows machine:
          system overview, processes, services, network, Defender, performance, installs.
        - Use the `tavily` server to search the web for:
          compatibility information, error codes, known issues, and OS-specific step-by-step fixes.
        - For each user request, silently break the problem into subtasks (e.g., "detect GPU model", "find latest driver", "check local performance") and decide which tools to call for each subtask.
        - Prefer `system_ops` tools when you need local context or to take action on this machine (e.g., system overview, GPU info, health checks, Defender scans, installs/uninstalls, process/service control).
        - Prefer `tavily` when you need external knowledge (e.g., latest drivers, vendor docs, known issues, best-practice guides), using the local context you gathered from `system_ops` to build better search queries.
        - Combine results from `system_ops` and Tavily into clear, safe, ordered troubleshooting steps rather than raw tool outputs.
        - Explain what you plan to do and ask for confirmation before any destructive change
          (installs, uninstalls, killing processes, restarting services, resetting network, etc.).
      server_names: [system_ops, tavily]

# Model provider defaults (API keys go in mcp_agent.secrets.yaml)
openai:
  default_model: gpt-4o-mini

anthropic:
  default_model: claude-sonnet-4-0
# google:
#   default_model: "gemini-1.5-pro"

